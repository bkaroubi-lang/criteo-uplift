# uv project config (replaces conda/environment.yml).
# Create the env:   uv sync           (uv fetches Python 3.11 automatically)
# Run a module:     uv run python -m src.run_comparison --sample dev --outcome visit
# environment.yml is kept as a conda fallback but uv is the primary path.
[project]
name = "criteo"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "econml==0.16.0",
    "scikit-learn==1.6.1",
    "pandas==3.0.3",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "pyarrow==25.0.0",
    "matplotlib==3.11.0",
    "lightgbm==4.6.0",
    "statsmodels==0.14.6",
    "markdown==3.10.2",
    "pypdf==6.14.2",
]

[tool.uv]
# Analysis project run via `python -m src.*`; not a build/installable package.
package = false
